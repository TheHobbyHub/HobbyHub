services:
  postgres:
    image: postgres:16-alpine
    container_name: hobbyhub_postgres
    environment:
      POSTGRES_USER: hobbyhub_user
      POSTGRES_PASSWORD: hobbyhub_password
      POSTGRES_DB: hobbyhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
